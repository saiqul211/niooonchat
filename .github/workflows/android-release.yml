name: Build and Release Android App

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
          validate-wrappers: false

      - name: Regenerate Gradle Wrapper
        working-directory: android
        run: |
          gradle wrapper --gradle-version 8.11.1 --distribution-type bin
          chmod +x gradlew

      - name: Build Native Kotlin Android APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: niooonchat-android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Niooon Chat Native Android Release v1.0.${{ github.run_number }}
          body: |
            ## Niooon Chat Native Android Release v1.0.${{ github.run_number }}
            - 100% Pure Native Android (Kotlin) Architecture (Capacitor Removed)
            - Live Production URL: https://niooonchat.vercel.app
            - Fallback Remote URL: https://niooonchat.vercel.app
            - Native AndroidBridge Javascript Interface (Haptics, Network, Status Bar, Share)
            - SwipeRefreshLayout, Fullscreen Dark Splash & Offline Retry State
            - Camera & File Picker Support with FileProvider
            - WebRTC Audio/Video Call Permissions & Hardware Back Navigation
          files: android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

